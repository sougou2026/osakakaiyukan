<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SharePointリンク</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;font-family:system-ui,-apple-system,sans-serif;background:#eaf7f8;color:#173b4b}
main{max-width:560px;margin:8vh auto;background:#fff;padding:24px;border-radius:18px;box-shadow:0 6px 24px #174b5a18}
h1{font-size:1.5rem;margin-top:0}label{display:block;font-weight:650;margin:14px 0 6px}
input{width:100%;padding:12px;border:1px solid #a9cbd0;border-radius:9px;font:inherit}
button,.link{display:inline-block;border:0;border-radius:10px;padding:12px 16px;background:#087f8c;color:#fff;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;margin-top:16px}
.msg{color:#a12626;min-height:1.5em}.hidden{display:none}.note{color:#56727b;font-size:.88rem}
</style>
</head>
<body><main>
<section id="login">
<h1>🔐 ログイン</h1><p>ユーザーIDとパスワードを入力してください。</p>
<label for="uid">ユーザーID</label><input id="uid" autocomplete="username">
<label for="pw">パスワード</label><input id="pw" type="password" autocomplete="current-password">
<button id="loginBtn" type="button">ログイン</button><p id="msg" class="msg" role="alert"></p>
</section>
<section id="destination" class="hidden">
<h1>📁 リンク</h1><p>ログインしました。下のリンクから共有フォルダーを開いてください。</p>
<a class="link" href="https://osakacityeducation-my.sharepoint.com/:f:/g/personal/8126436_school_city_osaka_jp/IgAh7lTg_c_6S7Snq_0rblJcAcMVkdzF0tD0-RMamx1-NFQ?e=VUJF2x" target="_blank" rel="noopener noreferrer">SharePointフォルダーを開く ↗</a>
<p class="note">リンク先で学校アカウントなどのサインインが求められる場合があります。</p>
<button id="logoutBtn" type="button" style="background:#e1f1f3;color:#164e59">ログアウト</button>
</section></main>
<script>
const accounts = [{"id": "8126436", "password": "@6150027"}, {"id": "686", "password": "752"}, {"id": "5131624", "password": "5131624"}, {"id": "7931055", "password": "7931055"}];
const loginSection=document.getElementById("login"), destination=document.getElementById("destination");
document.getElementById("loginBtn").addEventListener("click",()=>{
 const id=document.getElementById("uid").value.trim(), password=document.getElementById("pw").value;
 if(accounts.some(a=>a.id===id && a.password===password)){
   document.getElementById("msg").textContent="";
   loginSection.classList.add("hidden"); destination.classList.remove("hidden");
 } else document.getElementById("msg").textContent="ユーザーIDまたはパスワードが違います。";
});
document.getElementById("logoutBtn").addEventListener("click",()=>{
 destination.classList.add("hidden"); loginSection.classList.remove("hidden");
 document.getElementById("pw").value="";
});
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("loginBtn").click();});
</script></body></html>
